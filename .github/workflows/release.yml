name: Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 2.0)'
        required: true
        default: '2.0'

permissions:
  contents: write

env:
  APP_NAME: Specs
  MAIN_JAR: Specs.jar
  VENDOR: Qcom-Toolbox
  DESCRIPTION: Show The Specs Of Your computer
  COPYRIGHT: Copyright © 2024 Qcom-Toolbox
  JLINK_OPTIONS: '--compress=zip-9 --strip-native-commands --strip-debug --no-man-pages --no-header-files'

jobs:
  build-jar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION=$(echo "$TAG" | sed -E 's/^[vV-]+//')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build fat JAR
        run: mvn -B package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/Specs.jar

  package-windows:
    needs: build-jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX
        run: choco install wix311 -y --no-progress

      - name: Add WiX to PATH
        run: echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist

      - name: Package MSI
        shell: bash
        env:
          VERSION: ${{ needs.build-jar.outputs.version }}
        run: |
          mkdir -p release
          jpackage \
            --input dist \
            --main-jar "$MAIN_JAR" \
            --name "$APP_NAME" \
            --type msi \
            --dest release \
            --icon "src/icon/Icon 128x128.ico" \
            --jlink-options "$JLINK_OPTIONS" \
            --win-dir-chooser \
            --win-shortcut \
            --win-menu \
            --win-menu-group "$APP_NAME" \
            --app-version "$VERSION" \
            --description "$DESCRIPTION" \
            --vendor "$VENDOR" \
            --copyright "$COPYRIGHT"

      - name: Package portable (app-image)
        shell: bash
        env:
          VERSION: ${{ needs.build-jar.outputs.version }}
        run: |
          jpackage \
            --input dist \
            --main-jar "$MAIN_JAR" \
            --name "$APP_NAME" \
            --type app-image \
            --dest release \
            --icon "src/icon/Icon 128x128.ico" \
            --jlink-options "$JLINK_OPTIONS" \
            --app-version "$VERSION" \
            --description "$DESCRIPTION" \
            --vendor "$VENDOR" \
            --copyright "$COPYRIGHT"
          cd release
          powershell Compress-Archive -Path "$APP_NAME" -DestinationPath "${APP_NAME}-${VERSION}-portable-windows.zip"
          rm -rf "$APP_NAME"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release/*

  package-linux:
    needs: build-jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist

      - name: Package DEB, RPM and portable
        env:
          VERSION: ${{ needs.build-jar.outputs.version }}
        run: |
          mkdir -p release
          for TYPE in deb rpm app-image; do
            jpackage \
              --input dist \
              --main-jar "$MAIN_JAR" \
              --name "$APP_NAME" \
              --type "$TYPE" \
              --dest release \
              --icon "src/icon/Icon 128x128.png" \
              --jlink-options "$JLINK_OPTIONS" \
              --app-version "$VERSION" \
              --description "$DESCRIPTION" \
              --vendor "$VENDOR" \
              --copyright "$COPYRIGHT"
          done
          tar -czf "release/${APP_NAME}-${VERSION}-portable-linux.tar.gz" -C release "$APP_NAME"
          rm -rf "release/$APP_NAME"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: release/*

  package-macos:
    needs: build-jar
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist

      - name: Package DMG, PKG and portable
        env:
          VERSION: ${{ needs.build-jar.outputs.version }}
        run: |
          mkdir -p release
          for TYPE in dmg pkg app-image; do
            jpackage \
              --input dist \
              --main-jar "$MAIN_JAR" \
              --name "$APP_NAME" \
              --type "$TYPE" \
              --dest release \
              --icon "src/icon/Icon 128x128.icns" \
              --jlink-options "$JLINK_OPTIONS" \
              --app-version "$VERSION" \
              --description "$DESCRIPTION" \
              --vendor "$VENDOR" \
              --copyright "$COPYRIGHT"
          done
          ditto -c -k --sequesterRsrc --keepParent "release/${APP_NAME}.app" "release/${APP_NAME}-${VERSION}-portable-macos.zip"
          rm -rf "release/${APP_NAME}.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: release/*

  release:
    needs: [build-jar, package-windows, package-linux, package-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '*-packages'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', needs.build-jar.outputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Specs ${{ needs.build-jar.outputs.version }}
          draft: false
          generate_release_notes: true
          files: packages/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
